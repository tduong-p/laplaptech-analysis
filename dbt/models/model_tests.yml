version: 2

models:
  - name: silver_user_event_tracking
    description: One row per valid tracked event with normalized timestamps, parsed device and page fields, and behavior group.
    columns:
      - name: id
        data_tests:
          - not_null
      - name: event_at_timestamp
        data_tests:
          - not_null
      - name: behavior_group
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [traffic, discovery, comparison, authentication, other]

  - name: silver_session_activity
    description: One row per non-null session.
    columns:
      - name: session_id
        data_tests:
          - not_null
          - unique
      - name: session_date
        data_tests:
          - not_null

  - name: silver_session_funnel
    description: One row per DeviceDetail session with ordered funnel timestamps.
    columns:
      - name: session_id
        data_tests:
          - not_null
          - unique
      - name: cohort_date
        data_tests:
          - not_null

  - name: silver_comparison_session_device
    description: One row per session and distinct device in qualifying comparison sessions.
    columns:
      - name: session_id
        data_tests:
          - not_null
      - name: device_id
        data_tests:
          - not_null

  - name: silver_comparison_sort_event
    description: One row per comparison sort event with exact device IDs and sort settings.
    columns:
      - name: event_id
        data_tests:
          - not_null
          - unique
      - name: sort_field
        data_tests:
          - not_null
      - name: sort_direction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [asc, desc]

  - name: mart_daily_site_kpis
    description: Daily website activity and comparison KPIs.
    columns:
      - name: event_date
        data_tests:
          - not_null
          - unique

  - name: mart_behavior_funnel_by_platform
    description: One row per cohort date, device category, and funnel step; funnel conversion and drop-off split by platform.
    columns:
      - name: cohort_date
        data_tests:
          - not_null
      - name: device_category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Mobile, Desktop, Other]

  - name: mart_product_data_quality_priority
    description: Product update priority based on interest, trend, and data completeness.
    columns:
      - name: device_id
        data_tests:
          - not_null
          - unique
      - name: priority_group
        data_tests:
          - accepted_values:
              arguments:
                values: ["Update Now", "Maintain", "Monitor", "Low Priority"]
